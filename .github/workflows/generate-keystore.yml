name: Generate Android Keystore

# One-time helper. Run manually, copy the four values from the downloaded secrets.txt into
# GitHub → Settings → Secrets and variables → Actions.
#
# Also uploads the keystore file as an artifact — download and keep it safe
# (Vault + offline backup). Losing it means you can never update existing
# installs on the Play Store.

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias (default: hme-vault)"
        required: false
        default: "hme-vault"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore + random password
        id: gen
        run: |
          ALIAS="$KEY_ALIAS"
          PASS="hme-$(openssl rand -hex 12)"
          echo "::add-mask::$PASS"
          KS="hme-vault-release.jks"

          keytool -genkeypair -v \
            -keystore "$KS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=HME Vault, OU=HME, O=Honest Money, C=US"

          B64=$(base64 -w 0 "$KS")

          echo "::add-mask::$B64"

          mkdir -p keystore-info
          {
            echo "ANDROID_KEYSTORE_BASE64="
            echo "$B64"
            echo ""
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_STORE_PASSWORD=$PASS"
            echo "ANDROID_KEY_PASSWORD=$PASS"
          } > keystore-info/secrets.txt
        env:
          KEY_ALIAS: ${{ inputs.alias }}

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: hme-vault-release-keystore
          retention-days: 1
          path: |
            hme-vault-release.jks
            keystore-info/secrets.txt

      - name: Explain secure download
        run: |
          echo "Download hme-vault-release-keystore within 24 hours."
          echo "Its secrets.txt contains all four values for GitHub Actions secrets."
          echo "The artifact contains UNENCRYPTED signing material: restrict repository access."
          echo "Back up both files in Vault and verify recovery, then delete the artifact."
          echo "For permanent production keys, local offline generation is safer than hosted generation."
