name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .
      - run: bunx eslint .
      - run: bunx tsc --noEmit
      - run: bunx vitest run
      # GHSA-23hp-3jrh-7fpw: tar 6.x is pinned by @capacitor/cli (build tool only, never shipped,
      # never fed untrusted archives). Remove this ignore when Capacitor moves to tar 7.5.19+.
      - run: bun audit --audit-level=critical --ignore=GHSA-23hp-3jrh-7fpw
      - run: bun run build
